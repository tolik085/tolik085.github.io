<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Authorisation code - Home Studio</title>
<style>
  :root { --bg:#0c0e12; --fg:#e8e8ea; --dim:#8a94a6; --line:#3a4a68; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:17px/1.6 Georgia,"Times New Roman",serif;
         min-height:100vh; display:flex; align-items:center; justify-content:center;
         padding:32px 16px; }
  main { max-width:640px; width:100%; }
  h1 { font-size:26px; margin:0 0 6px; }
  .dim { color:var(--dim); font-size:15px; margin-bottom:26px; }
  #code { font:15px/1.5 Consolas,"Courier New",monospace; word-break:break-all;
          background:#12151b; border:1px solid var(--line); border-radius:8px;
          padding:18px; color:#cfe2ff; user-select:all; }
  button { margin-top:16px; font:15px Georgia,serif; color:var(--fg);
           background:#1a1f29; border:1px solid var(--line); border-radius:6px;
           padding:10px 18px; cursor:pointer; }
  button:hover { background:#222836; }
  .err { color:#e88; }
</style>
</head>
<body>
<main>
  <h1>Authorisation code</h1>
  <div class="dim">Copy this into the publisher tool. It is valid for a few minutes and can be used once.</div>
  <div id="code">reading...</div>
  <button id="copy">Copy</button>
</main>
<script>
  var p = new URLSearchParams(location.search);
  var code = p.get("code");
  var err = p.get("error");
  var box = document.getElementById("code");
  if (code) {
    box.textContent = code;
  } else if (err) {
    box.className = "err";
    box.textContent = "TikTok returned an error: " + err +
                      (p.get("error_description") ? " - " + p.get("error_description") : "");
  } else {
    box.className = "err";
    box.textContent = "No code in the address. Start the authorisation from the tool again.";
  }
  document.getElementById("copy").onclick = function () {
    navigator.clipboard.writeText(box.textContent).then(function () {
      var b = document.getElementById("copy");
      b.textContent = "Copied";
      setTimeout(function () { b.textContent = "Copy"; }, 1500);
    });
  };
</script>
</body>
</html>
